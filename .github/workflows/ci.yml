name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only secrets. These are throwaway values; never reuse them in production.
  AUTH_SECRET: ci-auth-secret-0123456789abcdefghijklmnopqrstuvwxyz
  ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        # Additional check - ensure the database is initialized
        # The service health check runs inside the service container
    env:
      # App/migration connection (used by prisma generate + next build).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outreach_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client (for pg_isready)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check for committed secrets
        run: node scripts/check-secrets.cjs

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Testing PostgreSQL connection..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d outreach_test; then
              echo "PostgreSQL is ready and accepting connections"
              PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d outreach_test -c "SELECT 1;" && break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Apply migrations to a real database
        run: npx prisma migrate deploy

      - name: Integration tests
        env:
          # Integration suite opts in via TEST_DATABASE_URL; it truncates tables.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outreach_test?schema=public
        run: npx vitest run tests/integration

      - name: Build (Next.js + worker bundle)
        run: npm run build

      - name: Build the deployment bundle
        run: npm run build:deploy

      - name: Check the deployment bundle is complete
        run: |
          test -f deploy/server/server.js
          test -f deploy/worker/index.cjs
          test -f deploy/start.js
          test -d deploy/node_modules/.prisma/client
          echo "deployment bundle OK"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: email-outreach-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
